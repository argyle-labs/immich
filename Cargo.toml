[package]
name = "immich"
version = "0.1.0"
edition = "2021"
description = "Self-hosted photo/video (multi-service) — orca service-backend"

[package.metadata.orca]
category = "media"

[lib]
name = "immich"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "immich"
path = "src/main.rs"

[dependencies]
plugin-toolkit = { version = "=0.2.1-rc.39", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "http"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
sha1        = "0.10"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[lints.clippy]
let_underscore_must_use = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
