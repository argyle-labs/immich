[package]
name = "immich"
version = "0.1.0"
edition = "2021"
description = "Self-hosted photo/video (multi-service) — orca service-backend"

[package.metadata.orca]
category = "media"

[lib]
name = "immich"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "immich"
path = "src/main.rs"

# immich is a BACKEND-ONLY orca plugin: zero #[orca_tool]s. It registers a
# ServiceBackend over the orca socket and reaches the whole orca system
# through plugin-toolkit alone.
[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", tag = "v0.1.7-rc.1" }

[dev-dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", tag = "v0.1.7-rc.1" }
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints.clippy]
let_underscore_must_use = "deny"
